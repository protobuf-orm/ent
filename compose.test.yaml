# The engines entc/integration talks to, on the ports it looks for.
#
# Same images and versions as the `integration` job in
# .github/workflows/ci.yml -- one old and one new of each engine. SQLite is not
# here because it runs in-process.
#
#   docker compose -f compose.test.yaml up -d --wait
#   (cd entc/integration && go test -race -count=2 ./...)
#   docker compose -f compose.test.yaml down
#
# The ports are not configurable: the tests hardcode localhost:<port>.
name: ent-test

services:
  mysql8:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: test
      MYSQL_ROOT_PASSWORD: pass
    ports: ["3308:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-ppass"]
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 10

  mysql84:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: test
      MYSQL_ROOT_PASSWORD: pass
    ports: ["3309:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-ppass"]
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 10

  maria1011:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: test
      MYSQL_ROOT_PASSWORD: pass
    ports: ["4309:3306"]
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-ppass"]
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 10

  maria114:
    image: mariadb:11.4
    environment:
      MYSQL_DATABASE: test
      MYSQL_ROOT_PASSWORD: pass
    ports: ["4310:3306"]
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-ppass"]
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 10

  postgres14:
    image: postgres:14
    environment:
      POSTGRES_DB: test
      POSTGRES_PASSWORD: pass
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres17:
    image: postgres:17
    environment:
      POSTGRES_DB: test
      POSTGRES_PASSWORD: pass
    ports: ["5437:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
